<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Tab</title>
<meta name="description" content="Track who paid, who owes, who's square." />
<meta name="theme-color" content="#3A6350" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="The Tab" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F6F3EC; }
  .tab-root { font-family: -apple-system, 'Space Grotesk', 'Helvetica Neue', sans-serif; background: #F6F3EC; color: #1E2A22; padding: 28px 20px 60px; max-width: 560px; margin: 0 auto; min-height: 100vh; }
  .tab-mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  .tab-title { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .tab-sub { font-size: 13px; color: #5C6B62; margin: 4px 0 0; }
  .tab-section { margin-top: 28px; }
  .tab-section-label { font-size: 12px; color: #5C6B62; margin: 0 0 10px; font-weight: 500; }
  .tab-people-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tab-chip { display: inline-flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #DFDACB; border-radius: 999px; padding: 7px 12px; font-size: 14px; }
  .tab-chip button { background: none; border: none; cursor: pointer; color: #A9846F; display: flex; padding: 0; }
  .tab-input { border: 1px solid #DFDACB; background: #FFFFFF; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: inherit; color: #1E2A22; outline: none; }
  .tab-input:focus { border-color: #3A6350; }
  .tab-add-inline { display: flex; gap: 8px; }
  .tab-add-inline input { flex: 1; min-width: 0; }
  .tab-btn { border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
  .tab-btn-primary { background: #3A6350; color: #FFFFFF; }
  .tab-btn-ghost { background: #FFFFFF; color: #1E2A22; border: 1px solid #DFDACB; }
  .tab-balance-card { background: #FFFFFF; border: 1px solid #E7E2D3; border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .tab-balance-name { font-size: 15px; font-weight: 500; }
  .tab-balance-note { font-size: 12px; color: #5C6B62; margin-top: 2px; }
  .tab-balance-amt { font-size: 17px; font-weight: 600; }
  .tab-positive { color: #3A6350; }
  .tab-negative { color: #B0432B; }
  .tab-neutral { color: #8B897E; }
  .tab-settle-card { background: #FBF6EC; border: 1px dashed #C9A97D; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tab-settle-text { font-size: 14px; }
  .tab-settle-amt { font-weight: 600; }
  .tab-expense-item { border-top: 1px dashed #D8D2C0; padding: 14px 0; }
  .tab-expense-item:first-child { border-top: none; }
  .tab-expense-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tab-expense-title { font-size: 15px; font-weight: 500; }
  .tab-expense-meta { font-size: 12px; color: #5C6B62; margin-top: 2px; }
  .tab-expense-total { font-weight: 600; white-space: nowrap; }
  .tab-expense-debts { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .tab-debt-row { display: flex; justify-content: space-between; font-size: 13px; color: #4A554D; }
  .tab-delete-btn { background: none; border: none; cursor: pointer; color: #B0432B; opacity: 0.6; padding: 2px; font-size: 16px; line-height: 1; }
  .tab-delete-btn:hover { opacity: 1; }
  .tab-empty { text-align: center; padding: 32px 16px; color: #8B897E; font-size: 14px; }
  .tab-modal-overlay { position: fixed; inset: 0; background: rgba(30,42,34,0.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .tab-modal { background: #FBF9F3; border-radius: 16px; padding: 24px; width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; }
  .tab-modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .tab-modal-title { font-size: 18px; font-weight: 600; margin: 0; }
  .tab-field-label { font-size: 12px; color: #5C6B62; margin: 14px 0 6px; font-weight: 500; }
  .tab-participant-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .tab-participant-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #3A6350; }
  .tab-participant-name { flex: 1; font-size: 14px; }
  .tab-participant-amt { width: 90px; }
  .tab-form-error { color: #B0432B; font-size: 13px; margin-top: 10px; }
  .tab-fab-row { display: flex; gap: 10px; margin-top: 16px; }
  .tab-close-x { background: none; border: none; cursor: pointer; color: #1E2A22; font-size: 20px; line-height: 1; padding: 2px; }
  .tab-payer-chip { cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "the-tab-data";
  var uid = function () { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); };
  var fmt = function (n) { return (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var esc = function (s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        return { people: parsed.people || [], transactions: parsed.transactions || [] };
      }
    } catch (e) {}
    return { people: [], transactions: [] };
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ people: state.people, transactions: state.transactions }));
      state.saveError = "";
    } catch (e) {
      state.saveError = "Couldn't save. Storage might be full or blocked.";
    }
  }

  function simplifyDebts(balances) {
    var creditors = [], debtors = [];
    Object.keys(balances).forEach(function (id) {
      var amt = balances[id];
      if (amt > 0.005) creditors.push({ id: id, amt: amt });
      else if (amt < -0.005) debtors.push({ id: id, amt: -amt });
    });
    creditors.sort(function (a, b) { return b.amt - a.amt; });
    debtors.sort(function (a, b) { return b.amt - a.amt; });
    var result = [], i = 0, j = 0;
    while (i < creditors.length && j < debtors.length) {
      var pay = Math.min(creditors[i].amt, debtors[j].amt);
      result.push({ from: debtors[j].id, to: creditors[i].id, amount: pay });
      creditors[i].amt -= pay;
      debtors[j].amt -= pay;
      if (creditors[i].amt < 0.005) i++;
      if (debtors[j].amt < 0.005) j++;
    }
    return result;
  }

  var state = Object.assign({
    saveError: "",
    showAddExpense: false,
    newPersonName: "",
    desc: "",
    payer: "",
    participants: {},
    formError: ""
  }, load());

  function nameOf(id) {
    var p = state.people.filter(function (x) { return x.id === id; })[0];
    return p ? p.name : "Someone";
  }

  function computeBalances() {
    var balances = {};
    state.people.forEach(function (p) { balances[p.id] = 0; });
    state.transactions.forEach(function (t) {
      if (t.type === "expense") {
        var total = 0;
        t.debts.forEach(function (d) {
          if (balances[d.personId] === undefined) return;
          balances[d.personId] -= d.amount;
          total += d.amount;
        });
        if (balances[t.payer] !== undefined) balances[t.payer] += total;
      } else if (t.type === "settlement") {
        if (balances[t.from] !== undefined) balances[t.from] += t.amount;
        if (balances[t.to] !== undefined) balances[t.to] -= t.amount;
      }
    });
    return balances;
  }

  function addPerson() {
    var name = state.newPersonName.trim();
    if (!name) return;
    state.people.push({ id: uid(), name: name });
    state.newPersonName = "";
    save();
    render();
  }

  function removePerson(id) {
    var involved = state.transactions.some(function (t) {
      if (t.type === "expense") return t.payer === id || t.debts.some(function (d) { return d.personId === id; });
      return t.from === id || t.to === id;
    });
    if (involved) {
      alert("Can't remove someone who's part of an expense or payment. Delete those first.");
      return;
    }
    state.people = state.people.filter(function (p) { return p.id !== id; });
    save();
    render();
  }

  function openAddExpense() {
    state.desc = "";
    state.payer = state.people[0] ? state.people[0].id : "";
    var initial = {};
    state.people.forEach(function (p) { initial[p.id] = { checked: false, amount: "" }; });
    state.participants = initial;
    state.formError = "";
    state.showAddExpense = true;
    render();
  }

  function closeModal() {
    state.showAddExpense = false;
    render();
  }

  function toggleParticipant(id) {
    state.participants[id].checked = !state.participants[id].checked;
    render();
  }

  function setParticipantAmount(id, value) {
    state.participants[id].amount = value;
  }

  function splitEvenly() {
    var checkedIds = Object.keys(state.participants).filter(function (id) { return state.participants[id].checked; });
    if (checkedIds.length === 0) {
      state.formError = "Select who's splitting this first.";
      render();
      return;
    }
    var total = prompt("Total amount to split evenly?", "");
    var totalNum = parseFloat(total);
    if (!total || isNaN(totalNum) || totalNum <= 0) return;
    var each = totalNum / checkedIds.length;
    checkedIds.forEach(function (id) { state.participants[id].amount = each.toFixed(2); });
    state.formError = "";
    render();
  }

  function submitExpense() {
    var descInput = document.getElementById("desc-input");
    if (descInput) state.desc = descInput.value;
    if (!state.desc.trim()) { state.formError = "Give this expense a name."; render(); return; }
    if (!state.payer) { state.formError = "Pick who paid."; render(); return; }

    Object.keys(state.participants).forEach(function (id) {
      var el = document.getElementById("amt-" + id);
      if (el) state.participants[id].amount = el.value;
    });

    var debts = Object.keys(state.participants)
      .filter(function (id) { return state.participants[id].checked; })
      .map(function (id) { return { personId: id, amount: parseFloat(state.participants[id].amount) }; })
      .filter(function (d) { return !isNaN(d.amount) && d.amount > 0; });

    if (debts.length === 0) { state.formError = "Add an amount for at least one person."; render(); return; }

    state.transactions.unshift({ id: uid(), type: "expense", description: state.desc.trim(), payer: state.payer, debts: debts, date: Date.now() });
    save();
    state.showAddExpense = false;
    render();
  }

  function deleteTransaction(id) {
    state.transactions = state.transactions.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  function settleUp(fromId, toId, amount) {
    state.transactions.unshift({ id: uid(), type: "settlement", from: fromId, to: toId, amount: amount, date: Date.now() });
    save();
    render();
  }

  function setPayer(id) {
    state.payer = id;
    render();
  }

  window.__tabActions = {
    addPerson: addPerson, removePerson: removePerson, openAddExpense: openAddExpense, closeModal: closeModal,
    toggleParticipant: toggleParticipant, setParticipantAmount: setParticipantAmount, splitEvenly: splitEvenly,
    submitExpense: submitExpense, deleteTransaction: deleteTransaction, settleUp: settleUp, setPayer: setPayer
  };

  function render() {
    var balances = computeBalances();
    var settlements = simplifyDebts(balances);
    var html = "";

    html += '<div class="tab-root">';
    html += '<h1 class="tab-title">The Tab</h1>';
    html += '<p class="tab-sub">Track who paid, who owes, who\'s square.</p>';

    html += '<div class="tab-section"><p class="tab-section-label">Who\'s in</p><div class="tab-people-row">';
    state.people.forEach(function (p) {
      html += '<span class="tab-chip">' + esc(p.name) +
        '<button aria-label="Remove ' + esc(p.name) + '" onclick="__tabActions.removePerson(\'' + p.id + '\')">✕</button></span>';
    });
    html += '</div>';
    html += '<div class="tab-add-inline" style="margin-top:10px;">' +
      '<input class="tab-input" id="new-person-input" placeholder="Add a friend\'s name" value="' + esc(state.newPersonName) + '" />' +
      '<button class="tab-btn tab-btn-ghost" id="add-person-btn">+ Add</button></div></div>';

    html += '<div class="tab-section"><p class="tab-section-label">Balances</p>';
    if (state.people.length === 0) {
      html += '<div class="tab-empty">Add friends above to start tracking balances.</div>';
    } else {
      state.people.forEach(function (p) {
        var bal = balances[p.id] || 0;
        var isFlat = Math.abs(bal) < 0.005;
        var cls = isFlat ? "tab-neutral" : (bal > 0 ? "tab-positive" : "tab-negative");
        html += '<div class="tab-balance-card"><div><div class="tab-balance-name">' + esc(p.name) + '</div>' +
          '<div class="tab-balance-note">' + (isFlat ? "All settled up" : (bal > 0 ? "is owed" : "owes")) + '</div></div>' +
          '<div class="tab-balance-amt tab-mono ' + cls + '">' + (isFlat ? "$0.00" : "$" + fmt(Math.abs(bal))) + '</div></div>';
      });
    }
    html += '</div>';

    if (settlements.length > 0) {
      html += '<div class="tab-section"><p class="tab-section-label">Settle up</p>';
      settlements.forEach(function (s) {
        html += '<div class="tab-settle-card"><span class="tab-settle-text">' + esc(nameOf(s.from)) + ' pays ' + esc(nameOf(s.to)) +
          ' <span class="tab-settle-amt tab-mono">$' + fmt(s.amount) + '</span></span>' +
          '<button class="tab-btn tab-btn-ghost" onclick="__tabActions.settleUp(\'' + s.from + '\',\'' + s.to + '\',' + s.amount + ')">✓ Mark paid</button></div>';
      });
      html += '</div>';
    }

    html += '<div class="tab-section"><div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<p class="tab-section-label" style="margin:0;">History</p>' +
      '<button class="tab-btn tab-btn-primary" id="open-add-expense-btn" ' + (state.people.length === 0 ? 'disabled style="opacity:0.5;"' : '') + '>+ Add expense</button>' +
      '</div><div style="margin-top:12px;">';

    if (state.transactions.length === 0) {
      html += '<div class="tab-empty">No expenses yet. Add one to start the tab.</div>';
    } else {
      state.transactions.forEach(function (t) {
        html += '<div class="tab-expense-item">';
        if (t.type === "expense") {
          var total = t.debts.reduce(function (s, d) { return s + d.amount; }, 0);
          html += '<div class="tab-expense-head"><div><div class="tab-expense-title">' + esc(t.description) + '</div>' +
            '<div class="tab-expense-meta">' + esc(nameOf(t.payer)) + ' paid on ' + new Date(t.date).toLocaleDateString() + '</div></div>' +
            '<div style="display:flex;align-items:center;gap:10px;"><span class="tab-expense-total tab-mono">$' + fmt(total) + '</span>' +
            '<button class="tab-delete-btn" aria-label="Delete expense" onclick="__tabActions.deleteTransaction(\'' + t.id + '\')">🗑</button></div></div>';
          html += '<div class="tab-expense-debts">';
          t.debts.forEach(function (d) {
            html += '<div class="tab-debt-row"><span>' + esc(nameOf(d.personId)) + '</span><span class="tab-mono">$' + fmt(d.amount) + '</span></div>';
          });
          html += '</div>';
        } else {
          html += '<div class="tab-expense-head"><div><div class="tab-expense-title">' + esc(nameOf(t.from)) + ' paid ' + esc(nameOf(t.to)) + ' back</div>' +
            '<div class="tab-expense-meta">' + new Date(t.date).toLocaleDateString() + '</div></div>' +
            '<div style="display:flex;align-items:center;gap:10px;"><span class="tab-expense-total tab-mono">$' + fmt(t.amount) + '</span>' +
            '<button class="tab-delete-btn" aria-label="Delete payment" onclick="__tabActions.deleteTransaction(\'' + t.id + '\')">🗑</button></div></div>';
        }
        html += '</div>';
      });
    }
    html += '</div></div>';

    if (state.saveError) html += '<p class="tab-form-error">' + esc(state.saveError) + '</p>';

    if (state.showAddExpense) {
      html += '<div class="tab-modal-overlay" id="modal-overlay"><div class="tab-modal" id="modal-box">' +
        '<div class="tab-modal-head"><h2 class="tab-modal-title">Add expense</h2>' +
        '<button class="tab-close-x" id="close-modal-btn" aria-label="Close">✕</button></div>' +
        '<p class="tab-field-label" style="margin-top:0;">What was it for</p>' +
        '<input class="tab-input" style="width:100%;" id="desc-input" placeholder="Tacos, bowling, movie tickets..." value="' + esc(state.desc) + '" />' +
        '<p class="tab-field-label">Who paid</p><div class="tab-people-row">';
      state.people.forEach(function (p) {
        var active = state.payer === p.id;
        html += '<span class="tab-chip tab-payer-chip" style="background:' + (active ? "#3A6350" : "#FFFFFF") +
          ';color:' + (active ? "#FFFFFF" : "#1E2A22") + ';border:1px solid ' + (active ? "#3A6350" : "#DFDACB") +
          ';" onclick="__tabActions.setPayer(\'' + p.id + '\')">' + esc(p.name) + '</span>';
      });
      html += '</div><div style="display:flex;justify-content:space-between;align-items:baseline;">' +
        '<p class="tab-field-label">Who owes what</p>' +
        '<button class="tab-btn tab-btn-ghost" style="padding:5px 10px;font-size:13px;" id="split-evenly-btn">Split evenly</button></div>';
      state.people.forEach(function (p) {
        var part = state.participants[p.id] || { checked: false, amount: "" };
        html += '<div class="tab-participant-row"><input type="checkbox" id="chk-' + p.id + '" ' + (part.checked ? "checked" : "") +
          ' onchange="__tabActions.toggleParticipant(\'' + p.id + '\')" />' +
          '<span class="tab-participant-name">' + esc(p.name) + '</span>' +
          '<input class="tab-input tab-participant-amt tab-mono" id="amt-' + p.id + '" placeholder="0.00" inputmode="decimal" ' +
          (part.checked ? "" : "disabled") + ' value="' + esc(part.amount) + '" oninput="__tabActions.setParticipantAmount(\'' + p.id + '\', this.value)" /></div>';
      });
      if (state.formError) html += '<p class="tab-form-error">' + esc(state.formError) + '</p>';
      html += '<div class="tab-fab-row"><button class="tab-btn tab-btn-primary" id="save-expense-btn" style="flex:1;justify-content:center;">Save expense</button>' +
        '<button class="tab-btn tab-btn-ghost" id="cancel-expense-btn">Cancel</button></div></div></div>';
    }

    html += '</div>';

    document.getElementById("app").innerHTML = html;
    attachEvents();
  }

  function attachEvents() {
    var newPersonInput = document.getElementById("new-person-input");
    if (newPersonInput) {
      newPersonInput.addEventListener("input", function (e) { state.newPersonName = e.target.value; });
      newPersonInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addPerson(); });
      newPersonInput.focus();
      newPersonInput.setSelectionRange(newPersonInput.value.length, newPersonInput.value.length);
    }
    var addPersonBtn = document.getElementById("add-person-btn");
    if (addPersonBtn) addPersonBtn.addEventListener("click", addPerson);

    var openBtn = document.getElementById("open-add-expense-btn");
    if (openBtn) openBtn.addEventListener("click", function () { if (state.people.length > 0) openAddExpense(); });

    var closeBtn = document.getElementById("close-modal-btn");
    if (closeBtn) closeBtn.addEventListener("click", closeModal);
    var cancelBtn = document.getElementById("cancel-expense-btn");
    if (cancelBtn) cancelBtn.addEventListener("click", closeModal);
    var overlay = document.getElementById("modal-overlay");
    if (overlay) overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
    var modalBox = document.getElementById("modal-box");
    if (modalBox) modalBox.addEventListener("click", function (e) { e.stopPropagation(); });

    var splitBtn = document.getElementById("split-evenly-btn");
    if (splitBtn) splitBtn.addEventListener("click", splitEvenly);
    var saveBtn = document.getElementById("save-expense-btn");
    if (saveBtn) saveBtn.addEventListener("click", submitExpense);

    var descInput = document.getElementById("desc-input");
    if (descInput) descInput.addEventListener("input", function (e) { state.desc = e.target.value; });
  }

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
